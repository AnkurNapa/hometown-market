<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hometown Market</title>
  <meta name="description" content="Buy authentic products directly from shops in your hometown.">
  <meta name="theme-color" content="#3c0a6b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="#/">hometown<span>market</span></a>
      <p class="deliver"><strong>Delivering across India</strong><small>from 6 hometowns · prototype, sample shops</small></p>
      <form id="search" class="search" role="search">
        <label class="sr-only" for="q">Search</label>
        <input id="q" type="search" placeholder="Search &quot;peda&quot;, &quot;Agra&quot; or a PIN code" autocomplete="off">
        <button aria-label="Search">🔍</button>
      </form>
      <nav aria-label="Main navigation">
        <a href="#/sell">🏪<span>Sell</span></a>
        <a href="#/cart" class="basket">🛒<span>Basket</span><b id="cart-count">0</b></a>
      </nav>
    </div>
  </header>
  <main id="view"></main>
  <a id="cart-bar" class="cart-bar" href="#/cart" hidden></a>
  <footer>Hometown Market prototype. Every shop on this page is sample data.</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
