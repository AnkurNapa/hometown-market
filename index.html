<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hometown Market</title>
  <meta name="description" content="Buy authentic products directly from shops in your hometown.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://ankurnapa.github.io/hometown-market/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hometown Market">
  <meta property="og:title" content="Hometown Market: your hometown's famous sweets, at your door">
  <meta property="og:description" content="Order Mathura peda, Agra petha and Bikaner bhujia straight from the shop that made them.">
  <meta property="og:url" content="https://ankurnapa.github.io/hometown-market/">
  <meta property="og:image" content="https://ankurnapa.github.io/hometown-market/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Hometown Market with product cards for Mathura peda, Bikaneri bhujia, Agra petha and a gift box">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ankurnapa.github.io/hometown-market/og-image.jpg">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="strip">Prototype with sample shops. No real orders or payments.</p>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="#/" aria-label="Hometown Market home"><b>hometown</b><span>market</span></a>
      <div class="deliver"><strong>Delivery in 2 to 5 days</strong><small>To anywhere in India</small></div>
      <form id="search" class="search" role="search">
        <svg class="i lens" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <label class="sr-only" for="q">Search</label>
        <input id="q" type="search" placeholder="Search &quot;peda&quot;, &quot;Agra&quot; or a PIN code" autocomplete="off" enterkeyhint="search">
      </form>
      <a class="sell" href="#/sell">Sell with us</a>
      <button id="cart-btn" class="cart-btn" type="button"><span>My Cart</span></button>
    </div>
  </header>
  <main id="view"></main>
  <button id="cart-bar" class="cart-bar" type="button" hidden></button>
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="My Cart" hidden></aside>
  <div id="toast" class="toast" role="status" hidden></div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <footer>
    <nav aria-label="Footer">
      <a href="#/cat/sweets">Sweets</a><a href="#/cat/namkeen">Namkeen</a><a href="#/cat/gifts">Gift boxes</a><a href="#/cat/crafts">Toys and crafts</a><a href="#/sell">Sell with us</a>
    </nav>
    <p>Hometown Market prototype. Every shop on this site is sample data.</p>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
